<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie Ledger</title>
  <meta name="description" content="Private calorie, weight and meal-window ledger.">
  <meta name="theme-color" content="#0B1220">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ledger">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#38BDF8"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="34" r="22" fill="none" stroke="#1E2A4A" stroke-width="7"/>
          <path d="M 12.6 45.2 A 22 22 0 1 1 51.4 45.2" fill="none" stroke="url(#lg)"
                stroke-width="7" stroke-linecap="round"/>
          <line x1="32" y1="34" x2="43" y2="23" stroke="#E7EDF7" stroke-width="4" stroke-linecap="round"/>
          <circle cx="32" cy="34" r="4.5" fill="#E7EDF7"/>
        </svg>
      </div>
      <h1>Calorie Ledger</h1>
      <p class="muted">Private ledger on your own tailnet.</p>
      <form id="login-form">
        <input id="login-pass" type="password" placeholder="Passphrase" autocomplete="current-password" required>
        <button class="btn" type="submit">Unlock</button>
      </form>
      <p id="login-error" class="login-error" hidden></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title">Calorie Ledger</div>
      <button id="sync-chip" class="sync-chip" type="button" title="Sync status">✓</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today" aria-label="Today">
        <svg viewBox="0 0 24 24"><path d="M5 19a9 9 0 1 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 13l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="13" r="1.6" fill="currentColor"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="scan" aria-label="Scan">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 9v6M11 9v6M14 9v6M16.5 9v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Scan</span>
      </button>
      <button class="tab" data-tab="log" aria-label="Log">
        <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Log</span>
      </button>
      <button class="tab" data-tab="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Progress</span>
      </button>
      <button class="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6L5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
